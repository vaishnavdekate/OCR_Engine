[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "receipt-lens"
version = "1.0.0"
description = "Local receipt OCR with evidence-backed monetary extraction"
requires-python = ">=3.11"
dependencies = [
  "rapidocr==3.10.0", "onnxruntime==1.32.0", "fastapi==0.165.0",
  "uvicorn[standard]==0.54.0", "python-multipart==0.0.34", "pillow==13.0.0",
  "pypdfium2==5.15.2",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "httpx==0.28.1", "ruff"]

[project.scripts]
receipt-lens = "receipt_ocr.cli:main"

[tool.setuptools.packages.find]
include = ["receipt_ocr*"]

[tool.setuptools.package-data]
receipt_ocr = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: runs the real ONNX OCR models"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

